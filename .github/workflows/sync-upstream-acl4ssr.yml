name: 同步上游 ACL4SSR master 分支
on:
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:

jobs:
  sync-acl4ssr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ACL4SSR

      - name: 配置 Git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 拉取上游并同步
        run: |
          git remote add upstream https://github.com/ACL4SSR/ACL4SSR.git
          git fetch upstream
          git reset --hard upstream/master
          
          # 关键：删除上游自带的工作流目录，避免权限拦截和多余任务
          rm -rf .github
          
          # 如果有变更才提交，避免空提交
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "sync: 同步上游 ACL4SSR 规则"
            git push origin ACL4SSR --force
          else
            echo "上游无更新，跳过推送"
          fi
