name: 同步上游 ACL4SSR master 分支
on:
  schedule:
    # 每天北京时间 9:20 执行（UTC 01:20）
    - cron: '20 1 * * *'
  workflow_dispatch: # 开启手动触发

jobs:
  sync-acl4ssr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ACL4SSR # 检出你仓库的 ACL4SSR 分支

      - name: 配置 Git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 拉取上游并同步
        run: |
          # 添加上游 ACL4SSR 仓库
          git remote add upstream https://github.com/ACL4SSR/ACL4SSR.git
          git fetch upstream
          # 强制重置本地 ACL4SSR 分支 = 上游 master 分支最新状态
          git reset --hard upstream/master
          # 强制推送到你仓库的 ACL4SSR 分支
          git push origin ACL4SSR --force
