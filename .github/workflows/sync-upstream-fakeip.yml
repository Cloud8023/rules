name: 同步上游 clash-rules release 分支
on:
  schedule:
    - cron: '25 1 * * *'
  workflow_dispatch:

jobs:
  sync-fakeip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: fakeip

      - name: 配置 Git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 拉取上游并同步
        run: |
          set -euxo pipefail

          # 清理已存在的上游远程
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/wwqgtxx/clash-rules.git

          # 只拉取 release 分支，不拉标签
          git fetch upstream release --no-tags

          # 记录重置前后的哈希
          LOCAL_BEFORE=$(git rev-parse HEAD)
          REMOTE_HASH=$(git rev-parse upstream/release)
          echo "本地重置前: $LOCAL_BEFORE"
          echo "上游 release: $REMOTE_HASH"

          # 强制重置到上游 release 分支
          git reset --hard upstream/release

          # 删除上游自带的工作流目录
          rm -rf .github

          # 检查是否有文件变更（删除.github等）
          if [ -n "$(git status --porcelain)" ]; then
            echo "检测到文件变更，提交后推送"
            git add -A
            git commit -m "sync: 同步上游 clash-rules release 分支"
            git push origin fakeip --force --no-tags
          # 没有文件变更，但分支提交本身不同，直接推送
          elif [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/fakeip)" ]; then
            echo "分支提交有更新，直接推送"
            git push origin fakeip --force --no-tags
          else
            echo "上游无更新，跳过推送"
          fi
